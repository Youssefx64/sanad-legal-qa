name: Sanad CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dev dependencies
        run: |
          pip install --upgrade pip
          pip install -e "./backend[dev,mlops]"

      - name: Run Ruff Lint & Format check
        run: |
          ruff check backend
          ruff format --check backend

      - name: Run Mypy Static Type Analysis
        run: |
          mypy backend/src/sanad

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Frontend Typecheck
        run: |
          cd frontend
          npm ci || npm install
          npx tsc --noEmit

  backend-tests:
    name: Backend Test Suite (Cov >= 70%)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e "./backend[dev,mlops]"

      - name: Run Pytest with Coverage Gate (>= 70%)
        run: |
          pytest backend/tests/ --cov=sanad --cov-report=term-missing --cov-fail-under=70

  frontend-tests:
    name: Frontend Test Suite & Production Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Run Vite Production Build
        run: |
          cd frontend
          npm run build

  ragas-quality-gate:
    name: Corpus Re-index & RAGAS Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e "./backend[dev,mlops]"

      - name: Validate Extracted Corpus Integrity
        run: |
          python -m sanad.cli validate --articles-path data/processed/articles.json

      - name: Execute RAGAS Evaluation Quality Gate (Threshold >= 0.75)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m sanad.cli eval --subset ci --gate --threshold 0.75

      - name: Upload Evaluation Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragas-eval-reports
          path: reports/

  docker-build:
    name: Container Build & Packaging
    runs-on: ubuntu-latest
    needs: [ragas-quality-gate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t sanad-backend:latest -f backend/Dockerfile .

      - name: Build Frontend Docker Image
        run: |
          docker build -t sanad-frontend:latest -f frontend/Dockerfile ./frontend
