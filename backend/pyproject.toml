[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sanad"
version = "0.1.0"
description = "Sanad: Arabic Legal Q&A system over the Egyptian Civil Code"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Youssef Taha", email = "ytaha8586@gmail.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.8.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.23.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.20.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.1",
    "sse-starlette>=2.0.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
mlops = [
    "mlflow>=2.11.0",
    "locust>=2.24.0",
    "langfuse>=2.20.0",
    "dvc>=3.48.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.21.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12.20240311",
]

[project.scripts]
sanad = "sanad.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sanad"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "rank_bm25.*",
    "sentence_transformers.*",
    "pymupdf.*",
    "fitz.*",
    "bentoml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sanad.corpus.pdf_extract"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "sanad.bento_service"
disallow_untyped_decorators = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
