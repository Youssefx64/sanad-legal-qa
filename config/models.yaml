defaults:
  chat_model: nemotron-ultra-free
  embedding_model: liquid-lfm-embed-free
  judge_model: nemotron-ultra-free

chat_models:
  - id: nemotron-ultra-free
    label: "NVIDIA Nemotron 3 Ultra 550B (Free)"
    provider: openrouter
    model: "nvidia/nemotron-3-ultra-550b-a55b:free"
    params: { temperature: 0.1, max_tokens: 1024 }
    pricing: { input_per_1m: 0.0, output_per_1m: 0.0 }
    supports_streaming: true
    enabled: true

  - id: gemma-4-free
    label: "Google Gemma 4 31B IT (Free)"
    provider: openrouter
    model: "google/gemma-4-31b-it:free"
    params: { temperature: 0.1, max_tokens: 1024 }
    pricing: { input_per_1m: 0.0, output_per_1m: 0.0 }
    supports_streaming: true
    enabled: true

  - id: ollama-qwen25-7b
    label: "Qwen 2.5 7B Instruct (Ollama Local)"
    provider: ollama
    model: "qwen2.5:7b-instruct"
    params: { temperature: 0.1, max_tokens: 1024 }
    pricing: { input_per_1m: 0.0, output_per_1m: 0.0 }
    supports_streaming: true
    enabled: true

  - id: ollama-llama31-8b
    label: "Llama 3.1 8B (Ollama Local)"
    provider: ollama
    model: "llama3.1:8b"
    params: { temperature: 0.1, max_tokens: 1024 }
    pricing: { input_per_1m: 0.0, output_per_1m: 0.0 }
    supports_streaming: true
    enabled: true

  - id: ollama-gemma4-31b
    label: "Gemma 4 31B Cloud (Ollama Local)"
    provider: ollama
    model: "gemma4:31b-cloud"
    params: { temperature: 0.1, max_tokens: 1024 }
    pricing: { input_per_1m: 0.0, output_per_1m: 0.0 }
    supports_streaming: true
    enabled: true

embedding_models:
  - id: liquid-lfm-embed-free
    label: "Liquid LFM 2.5 Embedding 350M (Free)"
    provider: openrouter
    model: "liquid/lfm-2.5-embedding-350m:free"
    dimension: 1024
    query_prefix: ""
    document_prefix: ""
    batch_size: 64
    enabled: true

  - id: nemotron-embed-free
    label: "NVIDIA Nemotron 3 Embed 1B (Free)"
    provider: openrouter
    model: "nvidia/nemotron-3-embed-1b:free"
    dimension: 2048
    query_prefix: ""
    document_prefix: ""
    batch_size: 64
    enabled: true

  - id: llama-nemotron-embed-free
    label: "NVIDIA Llama Nemotron Embed VL 1B v2 (Free)"
    provider: openrouter
    model: "nvidia/llama-nemotron-embed-vl-1b-v2:free"
    dimension: 2048
    query_prefix: ""
    document_prefix: ""
    batch_size: 64
    enabled: true

  - id: local-hf-embed-1
    label: "Local sentence-transformers BGE-M3 (Offline)"
    provider: local_hf
    model: "BAAI/bge-m3"
    device: auto
    dimension: 1024
    batch_size: 32
    enabled: true

providers:
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: OPENROUTER_API_KEY
  openai_compatible:
    base_url_env: OPENAI_COMPAT_BASE_URL
    api_key_env: OPENAI_COMPAT_API_KEY
  ollama:
    base_url: "http://localhost:11434"
    base_url_env: OLLAMA_BASE_URL
  local_hf:
    base_url: "local"
