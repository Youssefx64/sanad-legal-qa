# ==============================================================================
# Sanad Legal Q&A — Nginx Canary Deployment Configuration
#
# Weighted Traffic Splitting (Canary 5% / Stable 95%) with Header Overrides
#
# Rollout Stages:
#   Stage 0: 0% Canary / 100% Stable (Internal verification via header X-Canary: always)
#   Stage 1: 5% Canary / 95% Stable  (Initial rollout; monitor Prometheus error rate & P95 latency)
#   Stage 2: 25% Canary / 75% Stable (Mid-stage rollout after 1 hour nominal metrics)
#   Stage 3: 50% Canary / 50% Stable (High-confidence canary after 6 hours nominal metrics)
#   Stage 4: 100% Full Cutover       (v2 promoted to primary stable release)
#
# Rollback Triggers:
#   - P95 latency > 2000 ms over 5m window
#   - HTTP 5xx error rate > 0.5%
#   - Quality gate faithfulness regression below 0.75
# ==============================================================================

# Split clients based on remote IP and user agent hash
split_clients "${remote_addr}${http_user_agent}" $canary_pool {
    5.0%        backend_canary;     # v2 candidate (5% weighted split)
    *           backend_stable;     # v1 production (95% baseline)
}

# Upstream pool definitions
upstream backend_stable {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream backend_canary {
    server backend_v2:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Dynamic target backend routing
    set $target_backend $canary_pool;

    # Override for manual tester routing
    if ($http_x_canary = "always") {
        set $target_backend backend_canary;
    }
    if ($http_x_canary = "never") {
        set $target_backend backend_stable;
    }

    # Tracking & Canary Status Response Header
    add_header X-Served-By $target_backend always;

    # Health check for reverse proxy
    location /health/lb {
        access_log off;
        return 200 '{"status":"healthy","proxy":"nginx-canary"}\n';
        add_header Content-Type application/json;
    }

    # API Proxy with SSE streaming and WebSocket support
    location / {
        proxy_pass http://$target_backend;
        proxy_http_version 1.1;

        # Keepalive and streaming headers
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for Server-Sent Events (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

